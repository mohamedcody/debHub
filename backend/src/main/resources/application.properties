spring.application.name=backend
server.port=8081

# Local PostgreSQL database. Override these with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devhub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:devhub}
spring.datasource.password=${DB_PASSWORD}

# JPA creates/updates tables from @Entity classes while developing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 is kept as a test dependency; the running app uses PostgreSQL.
spring.h2.console.enabled=false
